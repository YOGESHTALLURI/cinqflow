services:
  # 1. Backend API Service (Express + Prisma + SQLite)
  - type: web
    name: cinqflow-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (Vite React)
  - type: web
    name: cinqflow-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cinqflow-backend
          property: host
